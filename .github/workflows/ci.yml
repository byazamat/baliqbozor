name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Format
        run: pnpm format:check
      - name: Lint (включая mobile, D-06)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: i18n key parity
        run: pnpm i18n:check
      - name: Prisma schema
        run: pnpm db:validate
      - name: OpenAPI drift
        run: |
          pnpm api:generate
          git diff --exit-code -- packages/api-client \
            || (echo "::error::OpenAPI/клиент устарели: выполните pnpm api:generate и закоммитьте" && exit 1)
      - name: Build api, worker, web, admin
        run: pnpm build

  e2e:
    name: E2E (api, worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Start Postgres, Redis, MinIO
        run: pnpm infra:up
      - name: Apply migrations to a clean database
        run: pnpm db:migrate:deploy
      - name: Schema matches migrations (prisma migrate diff)
        run: pnpm db:check-drift
      - name: E2E tests
        run: pnpm test:e2e
      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail=200

  web-e2e:
    name: Web smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build workspace packages
        run: pnpm turbo run build --filter=@baliqbozor/web^...
      - name: Install Chromium
        run: pnpm --filter @baliqbozor/web exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm test:web-e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
