name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Format
        run: pnpm format:check
      - name: Lint (включая mobile, D-06)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        # При падении — выдержка из лога в аннотацию (читается через публичный API без авторизации).
        run: |
          set -o pipefail
          if ! pnpm test:unit 2>&1 | tee /tmp/unit.log; then
            excerpt=$(grep -E '●|✕|FAIL|Error|rror:|Expected|Received|at .*\.test\.' /tmp/unit.log | head -60 \
              | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Unit tests failed::${excerpt}"
            exit 1
          fi
      - name: i18n key parity
        run: pnpm i18n:check
      - name: Prisma schema
        run: pnpm db:validate
      - name: OpenAPI drift
        run: |
          pnpm api:generate
          git diff --exit-code -- packages/api-client \
            || (echo "::error::OpenAPI/клиент устарели: выполните pnpm api:generate и закоммитьте" && exit 1)
      - name: Build api, worker, web, admin
        run: pnpm build

  e2e:
    name: E2E (api, worker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Start Postgres, Redis, MinIO
        run: pnpm infra:up
      - name: Apply migrations to a clean database
        run: pnpm db:migrate:deploy
      - name: Schema matches migrations (prisma migrate diff)
        run: pnpm db:check-drift
      - name: E2E tests
        run: pnpm test:e2e
      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail=200

  web-e2e:
    name: Web smoke and M1–M2 acceptance (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Start Postgres, Redis, MinIO
        run: pnpm infra:up
      - name: Clean database → migrations → seed
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed
      - name: Build api, worker, web, admin
        run: pnpm build
      - name: Install Chromium
        run: pnpm --filter @baliqbozor/web exec playwright install --with-deps chromium
      - name: Playwright smoke (web, API mocked)
        run: pnpm test:web-e2e
      - name: Playwright M1–M2 acceptance (api, worker, web, admin)
        run: pnpm test:acceptance
      - name: Service logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail=200
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
