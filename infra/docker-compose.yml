# Локальная инфраструктура (SPEC 13.5): PostgreSQL 18, Redis 8, MinIO.
# Запуск: docker compose -f infra/docker-compose.yml up -d
name: baliqbozor

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: baliqbozor
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d baliqbozor']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Официальные образы minio/minio больше не публикуются (DECISIONS D-21) —
  # используется поддерживаемый сообществом форк с тем же CLI и API.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20

  # Создаёт приватный бакет и завершается.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-baliqbozor-private}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 minio minio123 &&
        mc mb --ignore-existing local/$${S3_BUCKET} &&
        mc anonymous set none local/$${S3_BUCKET} &&
        echo "bucket $${S3_BUCKET} ready (private)"
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  minio-data:
